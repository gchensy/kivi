{% set chinese = language.startswith("zh") %}
<a class="nav-link kivi-language-switch" lang="{{ 'en' if chinese else 'zh-CN' }}"
   hreflang="{{ 'en' if chinese else 'zh-CN' }}"
   href="{{ pathto('../' ~ ('en' if chinese else 'zh') ~ '/' ~ pagename ~ '.html', 1) }}">
  <i class="fa-solid fa-language" aria-hidden="true"></i>
  <span>{{ 'English' if chinese else '中文' }}</span>
</a>
