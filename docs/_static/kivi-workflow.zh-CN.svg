<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 870 240" width="870" height="240" role="img" aria-label="kivi 工作流程：用 bin_edges 拟合一次边界，用 pandas.cut 对每个样本分箱，再用 woe_table 和 psi_table 计算指标">
  <style>
    .card { fill: #f7f9ff; stroke: #d5def5; }
    .title { fill: #111827; font: 600 16px system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
    .desc { fill: #4b5563; font: 400 12.5px system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
    .small { fill: #6b7280; font: 500 10.5px ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .chip { fill: #e6edfc; }
    .code { fill: #1d3d9e; font: 500 12.5px ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .badge { fill: #2f5bd3; }
    .num { fill: #fff; font: 700 13px system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
    .bar { fill: #2f5bd3; }
    .bar2 { fill: #14a397; }
    .edge { stroke: #d97706; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .axis { stroke: #9ca3af; stroke-width: 1; }
    .arrow { stroke: #94a3b8; stroke-width: 2; fill: none; }
    .head { fill: #94a3b8; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #161b26; stroke: #2b3550; }
      .title { fill: #e5e7eb; }
      .desc { fill: #9ca3af; }
      .small { fill: #9ca3af; }
      .chip { fill: #1f2a44; }
      .code { fill: #a9bcff; }
      .badge { fill: #8aa8ff; }
      .num { fill: #14181e; }
      .bar { fill: #8aa8ff; }
      .bar2 { fill: #4fd1c5; }
      .edge { stroke: #fbbf24; }
      .axis { stroke: #4b5563; }
      .arrow { stroke: #64748b; }
      .head { fill: #64748b; }
    }
  </style>

  <!-- 1. 拟合一次边界 -->
  <g transform="translate(15 20)">
    <rect class="card" width="260" height="200" rx="14"/>
    <circle class="badge" cx="30" cy="32" r="13"/>
    <text class="num" x="30" y="36.5" text-anchor="middle">1</text>
    <text class="title" x="52" y="37.5">拟合一次边界</text>
    <rect class="chip" x="20" y="54" width="220" height="26" rx="6"/>
    <text class="code" x="30" y="71.5">bin_edges(reference)</text>
    <line class="axis" x1="36" y1="150" x2="228" y2="150"/>
    <rect class="bar" x="40" y="138" width="18" height="12" rx="2"/>
    <rect class="bar" x="64" y="128" width="18" height="22" rx="2"/>
    <rect class="bar" x="88" y="116" width="18" height="34" rx="2"/>
    <rect class="bar" x="112" y="106" width="18" height="44" rx="2"/>
    <rect class="bar" x="136" y="112" width="18" height="38" rx="2"/>
    <rect class="bar" x="160" y="124" width="18" height="26" rx="2"/>
    <rect class="bar" x="184" y="134" width="18" height="16" rx="2"/>
    <rect class="bar" x="208" y="142" width="18" height="8" rx="2"/>
    <line class="edge" x1="85" y1="96" x2="85" y2="154"/>
    <line class="edge" x1="133" y1="96" x2="133" y2="154"/>
    <line class="edge" x1="181" y1="96" x2="181" y2="154"/>
    <text class="small" x="20" y="154">−∞</text>
    <text class="small" x="230" y="154">+∞</text>
    <text class="desc" x="20" y="174">等频或等距边界，</text>
    <text class="desc" x="20" y="190">两端延伸至无穷。</text>
  </g>

  <path class="arrow" d="M281 120 H 300"/>
  <path class="head" d="M300 114 L 308 120 L 300 126 Z"/>

  <!-- 2. 对每个样本分箱 -->
  <g transform="translate(305 20)">
    <rect class="card" width="260" height="200" rx="14"/>
    <circle class="badge" cx="30" cy="32" r="13"/>
    <text class="num" x="30" y="36.5" text-anchor="middle">2</text>
    <text class="title" x="52" y="37.5">对每个样本分箱</text>
    <rect class="chip" x="20" y="54" width="220" height="26" rx="6"/>
    <text class="code" x="30" y="71.5">pd.cut(sample, edges)</text>
    <text class="small" x="20" y="122">基准</text>
    <line class="axis" x1="48" y1="122" x2="240" y2="122"/>
    <rect class="bar" x="53" y="102" width="28" height="20" rx="2"/>
    <rect class="bar" x="91" y="107" width="28" height="15" rx="2"/>
    <rect class="bar" x="129" y="105" width="28" height="17" rx="2"/>
    <rect class="bar" x="167" y="104" width="28" height="18" rx="2"/>
    <rect class="bar" x="205" y="107" width="28" height="15" rx="2"/>
    <text class="small" x="20" y="152">当前</text>
    <line class="axis" x1="48" y1="152" x2="240" y2="152"/>
    <rect class="bar2" x="53" y="132" width="28" height="20" rx="2"/>
    <rect class="bar2" x="91" y="138" width="28" height="14" rx="2"/>
    <rect class="bar2" x="129" y="136" width="28" height="16" rx="2"/>
    <rect class="bar2" x="167" y="133" width="28" height="19" rx="2"/>
    <rect class="bar2" x="205" y="135" width="28" height="17" rx="2"/>
    <line class="edge" x1="86" y1="96" x2="86" y2="156"/>
    <line class="edge" x1="124" y1="96" x2="124" y2="156"/>
    <line class="edge" x1="162" y1="96" x2="162" y2="156"/>
    <line class="edge" x1="200" y1="96" x2="200" y2="156"/>
    <text class="desc" x="20" y="174">开发样本与监测样本</text>
    <text class="desc" x="20" y="190">共用同一组边界。</text>
  </g>

  <path class="arrow" d="M571 120 H 590"/>
  <path class="head" d="M590 114 L 598 120 L 590 126 Z"/>

  <!-- 3. 计算指标 -->
  <g transform="translate(595 20)">
    <rect class="card" width="260" height="200" rx="14"/>
    <circle class="badge" cx="30" cy="32" r="13"/>
    <text class="num" x="30" y="36.5" text-anchor="middle">3</text>
    <text class="title" x="52" y="37.5">计算指标</text>
    <rect class="chip" x="20" y="54" width="220" height="26" rx="6"/>
    <text class="code" x="30" y="71.5">woe_table · psi_table</text>
    <text class="small" x="20" y="130">WOE</text>
    <line class="axis" x1="52" y1="126" x2="240" y2="126"/>
    <rect class="bar" x="60" y="112" width="26" height="14" rx="2"/>
    <rect class="bar2" x="96" y="126" width="26" height="15" rx="2"/>
    <rect class="bar2" x="132" y="126" width="26" height="22" rx="2"/>
    <rect class="bar2" x="168" y="126" width="26" height="6" rx="2"/>
    <rect class="bar" x="204" y="103" width="26" height="23" rx="2"/>
    <text class="desc" x="20" y="174">每箱一行：计数、占比、</text>
    <text class="desc" x="20" y="190">WOE、IV 与 PSI。</text>
  </g>
</svg>
