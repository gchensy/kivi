[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "kivi"
version = "1.2.0"
description = "Credit risk modeling with pandas: binning, WOE, scorecards, validation, calibration, strategy, monitoring and IFRS 9 expected credit loss"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "DATA-LICENSE.txt"]
authors = [{name = "Chensy"}]
keywords = ["credit risk", "risk management", "scorecard", "credit scoring", "binning", "weight of evidence", "woe", "information value", "psi", "population stability", "model monitoring", "master scale", "reject inference", "expected loss", "ifrs 9", "expected credit loss", "roc curve", "pandas"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = ["numpy>=1.24", "pandas>=2.0"]

[project.urls]
Documentation = "https://gchensy.github.io/kivi/"
Repository = "https://github.com/gchensy/kivi"
Changelog = "https://gchensy.github.io/kivi/en/release/index.html"
Issues = "https://github.com/gchensy/kivi/issues"

# scikit-learn, SciPy and statsmodels are only the references of tests/test_reference.py and never
# imported by kivi. The lower bounds are the oldest releases that pass those tests (checked on
# Python 3.10 with NumPy 1.24.4 and pandas 2.0.3): scikit-learn 1.3 puts infinity first in
# roc_curve, and the incomplete beta function of SciPy before 1.12 is accurate only to about 1e-9.
[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=6", "scikit-learn>=1.3", "scipy>=1.12", "statsmodels>=0.14"]
plot = ["matplotlib>=3.7"]
lint = ["ruff==0.17.6", "pre-commit>=3.5", "mypy==2.4.1", "pandas-stubs==3.1.0.261029"]
docs = ["sphinx>=7.2", "pydata-sphinx-theme>=0.15", "numpydoc>=1.7", "sphinx-design>=0.6", "sphinx-copybutton>=0.5", "matplotlib>=3.7"]

[tool.hatch.build.targets.wheel]
packages = ["src/kivi"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/README.md", "/README.zh-CN.md", "/LICENSE", "/DATA-LICENSE.txt", "/pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

# Measured in CI with `python -m pytest --cov`; a plain `python -m pytest` does not measure coverage.
[tool.coverage.run]
source = ["kivi"]
branch = true

[tool.coverage.report]
show_missing = true
# The total when coverage was introduced (99.12%), rounded down; raise it as tests are added.
fail_under = 99

[tool.ruff]
line-length = 100
target-version = "py310"
# The README code blocks align their comments by hand; keep ruff to Python files.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
known-first-party = ["kivi"]

[tool.ruff.lint.per-file-ignores]
# Docstrings are required for the public API, which numpydoc also validates in the docs build.
"tests/**" = ["D"]
"docs/**" = ["D"]

# `mypy` checks the package against the installed NumPy, whose stubs need Python 3.12 since
# NumPy 2.5, and the pandas-stubs pinned in the `lint` extra. Tests are not checked.
[tool.mypy]
files = ["src/kivi"]
python_version = "3.12"
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_unreachable = true
warn_redundant_casts = true
strict_equality = true
extra_checks = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
