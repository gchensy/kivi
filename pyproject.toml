[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "kivi"
version = "0.4.0"
description = "Binning, WOE, IV and PSI for credit risk modeling with pandas"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "DATA-LICENSE.txt"]
authors = [{name = "Chensy"}]
keywords = ["credit risk", "risk management", "scorecard", "credit scoring", "binning", "weight of evidence", "woe", "information value", "psi", "population stability", "model monitoring", "pandas"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = ["numpy>=1.24", "pandas>=2.0"]

[project.urls]
Documentation = "https://gchensy.github.io/kivi/"
Repository = "https://github.com/gchensy/kivi"
Changelog = "https://gchensy.github.io/kivi/en/release/index.html"
Issues = "https://github.com/gchensy/kivi/issues"

[project.optional-dependencies]
test = ["pytest>=8"]
lint = ["ruff==0.17.6", "pre-commit>=3.5"]
docs = ["sphinx>=7.2", "pydata-sphinx-theme>=0.15", "numpydoc>=1.7", "sphinx-design>=0.6", "sphinx-copybutton>=0.5", "matplotlib>=3.7"]

[tool.hatch.build.targets.wheel]
packages = ["src/kivi"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/README.md", "/README.zh-CN.md", "/LICENSE", "/DATA-LICENSE.txt", "/pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py310"
# The README code blocks align their comments by hand; keep ruff to Python files.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
known-first-party = ["kivi"]

[tool.ruff.lint.per-file-ignores]
# Docstrings are required for the public API, which numpydoc also validates in the docs build.
"tests/**" = ["D"]
"docs/**" = ["D"]
