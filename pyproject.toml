[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "kivi"
version = "0.3.0.dev0"
description = "Binning, weight of evidence and population stability for tabular models"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "DATA-LICENSE.txt"]
authors = [{name = "Chensy"}]
dependencies = ["numpy>=1.24", "pandas>=2.0"]

[project.urls]
Documentation = "https://gchensy.github.io/kivi/"
Repository = "https://github.com/gchensy/kivi"

[project.optional-dependencies]
test = ["pytest>=8"]
docs = ["sphinx>=7.2", "pydata-sphinx-theme>=0.15", "numpydoc>=1.7", "sphinx-design>=0.6", "sphinx-copybutton>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/kivi"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/README.md", "/LICENSE", "/DATA-LICENSE.txt", "/pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
