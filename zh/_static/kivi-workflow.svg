<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" width="960" height="240" role="img" aria-label="kivi workflow: define features once with FeatureSpec and compute them for every sample, fit edges once with bin_edges, cut every sample with pandas.cut, measure with woe_table and psi_table">
  <style>
    .card { fill: #f7f9ff; stroke: #d5def5; }
    .title { fill: #111827; font: 600 14px system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
    .desc { fill: #4b5563; font: 400 12.5px system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
    .small { fill: #6b7280; font: 500 10.5px ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .count { fill: #111827; font: 700 13px system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
    .chip { fill: #e6edfc; }
    .code { fill: #1d3d9e; font: 500 12px ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .badge { fill: #2f5bd3; }
    .num { fill: #fff; font: 700 13px system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
    .bar { fill: #2f5bd3; }
    .bar2 { fill: #14a397; }
    .dot { fill: #9ca3af; }
    .win { fill: #2f5bd3; fill-opacity: 0.14; }
    .win2 { fill: #14a397; fill-opacity: 0.16; }
    .edge { stroke: #d97706; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .axis { stroke: #9ca3af; stroke-width: 1; }
    .arrow { stroke: #94a3b8; stroke-width: 2; fill: none; }
    .head { fill: #94a3b8; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #161b26; stroke: #2b3550; }
      .title { fill: #e5e7eb; }
      .desc { fill: #9ca3af; }
      .small { fill: #9ca3af; }
      .count { fill: #e5e7eb; }
      .chip { fill: #1f2a44; }
      .code { fill: #a9bcff; }
      .badge { fill: #8aa8ff; }
      .num { fill: #14181e; }
      .bar { fill: #8aa8ff; }
      .bar2 { fill: #4fd1c5; }
      .dot { fill: #6b7280; }
      .win { fill: #8aa8ff; fill-opacity: 0.18; }
      .win2 { fill: #4fd1c5; fill-opacity: 0.16; }
      .edge { stroke: #fbbf24; }
      .axis { stroke: #4b5563; }
      .arrow { stroke: #64748b; }
      .head { fill: #64748b; }
    }
  </style>

  <!-- 1. Define features once -->
  <g transform="translate(12 20)">
    <rect class="card" width="216" height="200" rx="14"/>
    <circle class="badge" cx="28" cy="32" r="13"/>
    <text class="num" x="28" y="36.5" text-anchor="middle">1</text>
    <text class="title" x="48" y="37">Define features once</text>
    <rect class="chip" x="16" y="54" width="184" height="26" rx="6"/>
    <text class="code" x="26" y="71.5">spec.compute(sample, …)</text>
    <rect class="win2" x="68" y="110" width="56" height="38"/>
    <rect class="win" x="124" y="110" width="56" height="38"/>
    <text class="small" x="96" y="105" text-anchor="middle">6m_3m</text>
    <text class="small" x="152" y="105" text-anchor="middle">3m</text>
    <text class="count" x="96" y="134" text-anchor="middle">3</text>
    <text class="count" x="152" y="134" text-anchor="middle">5</text>
    <line class="axis" x1="18" y1="148" x2="180" y2="148"/>
    <circle class="dot" cx="24" cy="148" r="3.2"/>
    <circle class="dot" cx="37" cy="148" r="3.2"/>
    <circle class="dot" cx="49" cy="148" r="3.2"/>
    <circle class="dot" cx="60" cy="148" r="3.2"/>
    <circle class="bar2" cx="79" cy="148" r="3.2"/>
    <circle class="bar2" cx="97" cy="148" r="3.2"/>
    <circle class="bar2" cx="113" cy="148" r="3.2"/>
    <circle class="bar" cx="132" cy="148" r="3.2"/>
    <circle class="bar" cx="142" cy="148" r="3.2"/>
    <circle class="bar" cx="152" cy="148" r="3.2"/>
    <circle class="bar" cx="162" cy="148" r="3.2"/>
    <circle class="bar" cx="172" cy="148" r="3.2"/>
    <line class="edge" x1="180" y1="96" x2="180" y2="154"/>
    <text class="small" x="185" y="154">t</text>
    <text class="desc" x="16" y="174">Point-in-time windows,</text>
    <text class="desc" x="16" y="190">the same in every sample.</text>
  </g>

  <path class="arrow" d="M231 120 H 242"/>
  <path class="head" d="M242 114 L 250 120 L 242 126 Z"/>

  <!-- 2. Fit edges once -->
  <g transform="translate(252 20)">
    <rect class="card" width="216" height="200" rx="14"/>
    <circle class="badge" cx="28" cy="32" r="13"/>
    <text class="num" x="28" y="36.5" text-anchor="middle">2</text>
    <text class="title" x="48" y="37">Fit edges once</text>
    <rect class="chip" x="16" y="54" width="184" height="26" rx="6"/>
    <text class="code" x="26" y="71.5">bin_edges(reference)</text>
    <line class="axis" x1="34" y1="150" x2="182" y2="150"/>
    <rect class="bar" x="38" y="138" width="14" height="12" rx="2"/>
    <rect class="bar" x="56" y="128" width="14" height="22" rx="2"/>
    <rect class="bar" x="74" y="116" width="14" height="34" rx="2"/>
    <rect class="bar" x="92" y="106" width="14" height="44" rx="2"/>
    <rect class="bar" x="110" y="112" width="14" height="38" rx="2"/>
    <rect class="bar" x="128" y="124" width="14" height="26" rx="2"/>
    <rect class="bar" x="146" y="134" width="14" height="16" rx="2"/>
    <rect class="bar" x="164" y="142" width="14" height="8" rx="2"/>
    <line class="edge" x1="72" y1="96" x2="72" y2="154"/>
    <line class="edge" x1="108" y1="96" x2="108" y2="154"/>
    <line class="edge" x1="144" y1="96" x2="144" y2="154"/>
    <text class="small" x="16" y="154">−∞</text>
    <text class="small" x="185" y="154">+∞</text>
    <text class="desc" x="16" y="174">Quantile or uniform edges,</text>
    <text class="desc" x="16" y="190">infinite at both ends.</text>
  </g>

  <path class="arrow" d="M471 120 H 482"/>
  <path class="head" d="M482 114 L 490 120 L 482 126 Z"/>

  <!-- 3. Cut every sample -->
  <g transform="translate(492 20)">
    <rect class="card" width="216" height="200" rx="14"/>
    <circle class="badge" cx="28" cy="32" r="13"/>
    <text class="num" x="28" y="36.5" text-anchor="middle">3</text>
    <text class="title" x="48" y="37">Cut every sample</text>
    <rect class="chip" x="16" y="54" width="184" height="26" rx="6"/>
    <text class="code" x="26" y="71.5">pd.cut(sample, edges)</text>
    <text class="small" x="16" y="122">ref</text>
    <line class="axis" x1="44" y1="122" x2="200" y2="122"/>
    <rect class="bar" x="49" y="102" width="22" height="20" rx="2"/>
    <rect class="bar" x="79" y="107" width="22" height="15" rx="2"/>
    <rect class="bar" x="109" y="105" width="22" height="17" rx="2"/>
    <rect class="bar" x="139" y="104" width="22" height="18" rx="2"/>
    <rect class="bar" x="169" y="107" width="22" height="15" rx="2"/>
    <text class="small" x="16" y="152">cur</text>
    <line class="axis" x1="44" y1="152" x2="200" y2="152"/>
    <rect class="bar2" x="49" y="132" width="22" height="20" rx="2"/>
    <rect class="bar2" x="79" y="138" width="22" height="14" rx="2"/>
    <rect class="bar2" x="109" y="136" width="22" height="16" rx="2"/>
    <rect class="bar2" x="139" y="133" width="22" height="19" rx="2"/>
    <rect class="bar2" x="169" y="135" width="22" height="17" rx="2"/>
    <line class="edge" x1="75" y1="96" x2="75" y2="156"/>
    <line class="edge" x1="105" y1="96" x2="105" y2="156"/>
    <line class="edge" x1="135" y1="96" x2="135" y2="156"/>
    <line class="edge" x1="165" y1="96" x2="165" y2="156"/>
    <text class="desc" x="16" y="174">Development and monitoring</text>
    <text class="desc" x="16" y="190">samples share the edges.</text>
  </g>

  <path class="arrow" d="M711 120 H 722"/>
  <path class="head" d="M722 114 L 730 120 L 722 126 Z"/>

  <!-- 4. Measure -->
  <g transform="translate(732 20)">
    <rect class="card" width="216" height="200" rx="14"/>
    <circle class="badge" cx="28" cy="32" r="13"/>
    <text class="num" x="28" y="36.5" text-anchor="middle">4</text>
    <text class="title" x="48" y="37">Measure</text>
    <rect class="chip" x="16" y="54" width="184" height="26" rx="6"/>
    <text class="code" x="26" y="71.5">woe_table · psi_table</text>
    <text class="small" x="16" y="130">WOE</text>
    <line class="axis" x1="50" y1="126" x2="200" y2="126"/>
    <rect class="bar" x="56" y="112" width="22" height="14" rx="2"/>
    <rect class="bar2" x="86" y="126" width="22" height="15" rx="2"/>
    <rect class="bar2" x="116" y="126" width="22" height="22" rx="2"/>
    <rect class="bar2" x="146" y="126" width="22" height="6" rx="2"/>
    <rect class="bar" x="176" y="103" width="22" height="23" rx="2"/>
    <text class="desc" x="16" y="174">One row per bin: counts,</text>
    <text class="desc" x="16" y="190">shares, WOE, IV and PSI.</text>
  </g>
</svg>
