name: Release

# Publishes to PyPI when a tag "v<version>" is pushed, for example v0.3.1.
# The tag must match the version in pyproject.toml and point at a commit on
# master. The GitHub release is created only after the upload succeeds.
# Uses PyPI trusted publishing through the protected "pypi" environment:
# no API token is stored in the repository.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the tag
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match version ${version} in pyproject.toml (expected v${version})."
            exit 1
          fi
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/master; then
            echo "::error::Tag ${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not on master. Merge the release commit first."
            exit 1
          fi

      - name: Test
        run: |
          python -m pip install -e ".[test]"
          python -m pytest

      - name: Build and check the distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/kivi/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          flags=()
          if [[ "${version}" =~ (a|b|rc|dev)[0-9]*$ ]]; then
            flags+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" dist/* "${flags[@]}" \
            --verify-tag \
            --title "kivi ${version}" \
            --generate-notes \
            --notes "Install with \`pip install -U kivi==${version}\`. Release notes: [English](https://gchensy.github.io/kivi/en/release/index.html) · [中文](https://gchensy.github.io/kivi/zh/release/index.html)"
