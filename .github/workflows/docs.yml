name: Documentation

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ".[test,docs,lint]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .
          mypy

      - name: Test
        run: |
          python -m pytest --cov
          python -m sphinx -W -b doctest docs docs/_build/doctest

      - name: Build English and Chinese editions
        run: python docs/build.py

      - name: Publish to gh-pages
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        working-directory: docs/_build/html
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish documentation for ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

  # Not part of the required `build` check; it tests the oldest versions that pyproject.toml allows.
  minimum-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the oldest supported NumPy and pandas
        run: python -m pip install -e ".[test]" "numpy==1.24.4" "pandas==2.0.3"

      - name: Test
        run: python -m pytest

  # Not part of the required `build` check; it tests the newest Python release with the newest
  # NumPy, pandas and matplotlib. Move it to each new Python release when that comes out.
  newest-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"

      - name: Install the newest releases
        run: python -m pip install -e ".[test,plot]"

      - name: Test
        run: python -m pytest
